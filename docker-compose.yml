# Local development dependencies. Copy .env.example to .env first.
services:
  postgres:
    image: postgres:17-alpine
    container_name: writeproof-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-writeproof}
      POSTGRES_USER: ${DB_USERNAME:-writeproof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - writeproof-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  writeproof-pgdata:
