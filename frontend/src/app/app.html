<main class="shell">
  <h1>Writeproof</h1>
  <p class="tagline">Every word, provably human.</p>

  <p class="status" [attr.data-status]="health.status()">
    @switch (health.status()) {
      @case ('up') {
        Backend online
      }
      @case ('down') {
        Backend unreachable
      }
      @default {
        Checking backend&hellip;
      }
    }
  </p>

  <router-outlet />
</main>
