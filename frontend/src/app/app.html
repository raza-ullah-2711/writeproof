<main class="shell">
  <h1>Writeproof</h1>
  <p class="tagline">Every word, provably human.</p>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Wallet</a
    >
    <a routerLink="/letters" routerLinkActive="active">Letters</a>
    <a routerLink="/contacts" routerLinkActive="active">Contacts</a>
    <a routerLink="/open" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Open letters</a
    >
    <a routerLink="/handwriting" routerLinkActive="active">Handwriting</a>
    <a routerLink="/capture" routerLinkActive="active">Capture playground</a>
    @if (admin.role()) {
      <a routerLink="/admin" routerLinkActive="active" class="admin-link">Admin</a>
    }
  </nav>

  <p class="status" [attr.data-status]="health.status()">
    @switch (health.status()) {
      @case ('up') {
        Backend online
      }
      @case ('down') {
        Backend unreachable
      }
      @default {
        Checking backend&hellip;
      }
    }
  </p>

  <router-outlet />
</main>
