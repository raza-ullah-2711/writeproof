name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL via Testcontainers (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  deploy:
    name: Production stack (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate secrets
        run: ./deploy/generate-env.sh localhost
      # Builds the real images from source (multi-stage), then starts Postgres, the API and Caddy.
      - name: Build images and start the stack
        run: docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test over HTTPS
        run: INSECURE=1 ./deploy/smoke-test.sh https://localhost
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yml down -v
