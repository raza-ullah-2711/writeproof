spring:
  application:
    name: writeproof
  datasource:
    # All connection settings come from the environment; see /.env.example.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/writeproof}
    username: ${DB_USERNAME:writeproof}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
