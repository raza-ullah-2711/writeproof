spring:
  application:
    name: writeproof
  datasource:
    # All connection settings come from the environment; see /.env.example.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/writeproof}
    username: ${DB_USERNAME:writeproof}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    enabled: true
    locations: classpath:db/migration

writeproof:
  auth:
    # Base64 HMAC key, >= 32 bytes decoded. Generate with: openssl rand -base64 32
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:PT15M}
    challenge-ttl: PT2M
  admin:
    # Wallet addresses that are always ADMIN while listed (comma-separated): how the first admin gets in.
    bootstrap-keys: ${ADMIN_PUBLIC_KEYS:}
  handwriting:
    # Minimum similarity score (0..1) to count as a match. Calibrated on synthetic strokes only.
    threshold: ${HANDWRITING_THRESHOLD:0.5}
    # Similarity scores help forgers refine attempts; keep them out of responses in production.
    expose-scores: ${HANDWRITING_EXPOSE_SCORES:false}
    # Base64 AES-256 key encrypting stored handwriting at rest. Generate: openssl rand -base64 32
    data-key: ${HANDWRITING_DATA_KEY}
  ledger:
    # Base64 32-byte Ed25519 seed for the key that signs ledger checkpoints. Generate:
    # openssl rand -base64 32. Clients pin its public half: keep it, and back it up.
    signing-key: ${LEDGER_SIGNING_KEY}
    checkpoint-interval: ${LEDGER_CHECKPOINT_INTERVAL:PT10M}
    # Optional file each published checkpoint is appended to (JSON lines), for outside witnesses.
    checkpoint-log: ${LEDGER_CHECKPOINT_LOG:}
    # Only while rotating: the key being retired. It signs the handover to signing-key at startup.
    previous-signing-key: ${LEDGER_PREVIOUS_SIGNING_KEY:}
  rate-limits:
    enabled: ${RATE_LIMITS_ENABLED:true}
    scale: 1

server:
  port: ${PORT:8080}
  # Finish in-flight requests on shutdown (e.g. during an upgrade).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
