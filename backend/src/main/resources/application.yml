spring:
  application:
    name: writeproof
  datasource:
    # All connection settings come from the environment; see /.env.example.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/writeproof}
    username: ${DB_USERNAME:writeproof}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

writeproof:
  auth:
    # Base64 HMAC key, >= 32 bytes decoded. Generate with: openssl rand -base64 32
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:PT15M}
    challenge-ttl: PT2M
  handwriting:
    # Minimum similarity score (0..1) to count as a match. Calibrated on synthetic strokes only.
    threshold: ${HANDWRITING_THRESHOLD:0.5}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
